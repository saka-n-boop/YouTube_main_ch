name: Run YouTube list Scraper

on:
  # GASなどの外部APIやGitHub画面からの手動実行を受け付ける設定
  workflow_dispatch:

jobs:
  scrape-news:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper
      env:
        # ここでシークレットを環境変数にマッピング
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        DIST_SPREADSHEET_ID: ${{ secrets.DIST_SPREADSHEET_ID }}
      run: |
        python main.py

    - name: Check for workflow failure (optional)
      if: ${{ failure() }}
      run: echo "Workflow failed. Check logs for details."
